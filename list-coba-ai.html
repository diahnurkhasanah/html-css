<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Example</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-8">

    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md space-y-8">

        <!-- Unordered List -->
        <div>
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                🍎 Unordered List
            </h2>
            <ul class="space-y-2">
                <li class="flex items-center gap-3 bg-green-50 border border-green-200 rounded-lg px-4 py-2 text-green-800 font-medium">
                    <span class="w-2 h-2 bg-green-500 rounded-sm inline-block"></span>
                    Mangga
                </li>
                <li class="flex items-center gap-3 bg-yellow-50 border border-yellow-200 rounded-lg px-4 py-2 text-yellow-800 font-medium">
                    <span class="w-2 h-2 bg-yellow-500 rounded-sm inline-block"></span>
                    Pisang
                </li>
                <li class="flex items-center gap-3 bg-red-50 border border-red-200 rounded-lg px-4 py-2 text-red-800 font-medium">
                    <span class="w-2 h-2 bg-red-500 rounded-sm inline-block"></span>
                    Jambu
                </li>
            </ul>
        </div>

        <hr class="border-gray-200" />

        <!-- Ordered List -->
        <div>
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                📋 Ordered List — Cara Buat Repository GitHub
            </h2>
            <ol class="space-y-3">
                <li class="flex items-start gap-3">
                    <span class="flex-shrink-0 w-7 h-7 bg-indigo-500 text-white rounded-full flex items-center justify-center text-sm font-bold">A</span>
                    <span class="text-gray-600 pt-0.5">Buka <span class="text-indigo-500 font-semibold">github.com</span></span>
                </li>
                <li class="flex items-start gap-3">
                    <span class="flex-shrink-0 w-7 h-7 bg-indigo-500 text-white rounded-full flex items-center justify-center text-sm font-bold">B</span>
                    <span class="text-gray-600 pt-0.5">Klik tombol <span class="bg-gray-100 px-1.5 py-0.5 rounded text-sm font-mono">+</span> di kanan atas</span>
                </li>
                <li class="flex items-start gap-3">
                    <span class="flex-shrink-0 w-7 h-7 bg-indigo-500 text-white rounded-full flex items-center justify-center text-sm font-bold">C</span>
                    <span class="text-gray-600 pt-0.5">Pilih <span class="font-semibold text-gray-700">New Repository</span></span>
                </li>
                <li class="flex items-start gap-3">
                    <span class="flex-shrink-0 w-7 h-7 bg-indigo-500 text-white rounded-full flex items-center justify-center text-sm font-bold">D</span>
                    <span class="text-gray-600 pt-0.5">Isi nama repository</span>
                </li>
                <li class="flex items-start gap-3">
                    <span class="flex-shrink-0 w-7 h-7 bg-indigo-500 text-white rounded-full flex items-center justify-center text-sm font-bold">E</span>
                    <span class="text-gray-600 pt-0.5">Hidupkan <span class="text-green-600 font-semibold">Add README</span></span>
                </li>
                <li class="flex items-start gap-3">
                    <span class="flex-shrink-0 w-7 h-7 bg-indigo-500 text-white rounded-full flex items-center justify-center text-sm font-bold">F</span>
                    <span class="text-gray-600 pt-0.5">Klik <span class="bg-green-500 text-white px-2 py-0.5 rounded text-sm font-semibold">Create Repository</span></span>
                </li>
            </ol>
        </div>

    </div>

</body>
</html>
